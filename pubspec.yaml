name: palio_uggiate
description: "Palio Uggiate con Ronago: calendario, classifiche, giochi e sponsor del Palio dei rioni."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10
  google_maps_flutter: ^2.19.0
  # Google Maps SDK 10 per iOS: installabile con Swift Package Manager (senza CocoaPods)
  google_maps_flutter_ios_sdk10: ^2.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/header.webp
    - assets/facebook.png
    - assets/instagram.png
    - assets/vs.webp
    - assets/vs_scuro.webp

# icona dell'app: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/icona.png
  remove_alpha_ios: true
