name: palio_uggiate
description: "Palio Uggiate con Ronago: calendario, classifiche, giochi e sponsor del Palio dei rioni."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/home.webp
    - assets/mappa_rioni.webp
    - assets/sfondi/
    - assets/facebook.png
    - assets/instagram.png
    - assets/vs.webp
    - assets/vs_scuro.webp
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-EncodeSans.txt
  # Nunito per i testi, Encode Sans Semi Condensed per titoli e scritte della Home (SIL Open Font License, assets/fonts/OFL-*.txt), da Google Fonts:
  # file statici ricavati dai variabili, un peso per file
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: EncodeSansSemiCondensed
      fonts:
        - asset: assets/fonts/EncodeSansSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EncodeSansSemiCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/EncodeSansSemiCondensed-ExtraBold.ttf
          weight: 800

# icona dell'app: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icona.png
  remove_alpha_ios: true
  # Android ritaglia l'icona a cerchio o a goccia: icona adattiva con l'immagine al centro su sfondo sfumato
  adaptive_icon_background: assets/android/icona-sfondo.png
  adaptive_icon_foreground: assets/android/icona-primo-piano.png
  min_sdk_android: 24

